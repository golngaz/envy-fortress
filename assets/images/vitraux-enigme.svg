<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="glow7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="1" stop-color="#c8902f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mur de pierre -->
  <rect width="820" height="560" fill="#211f29"/>
  <rect width="820" height="560" fill="#000" opacity="0.12"/>

  <!-- monolithe central, derrière -->
  <rect x="398" y="60" width="24" height="430" fill="#1c4a66" opacity="0.6"/>
  <circle cx="410" cy="272" r="9" fill="#bfe6ff" opacity="0.55"/>
  <circle cx="410" cy="272" r="3" fill="#0a2233" opacity="0.8"/>

  <text x="410" y="32" text-anchor="middle" fill="#e8d39a" font-size="20" font-style="italic">Les 7 vitraux de l'église</text>

  <!-- ============ 7e VITRAIL : la prière (focal, en haut) ============ -->
  <circle cx="410" cy="150" r="120" fill="url(#halo)"/>
  <path d="M340,250 L340,98 Q340,46 410,46 Q480,46 480,98 L480,250 Z" fill="#6e4d12" stroke="#e7c45a" stroke-width="6"/>
  <path d="M347,247 L347,100 Q347,53 410,53 Q473,53 473,100 L473,247 Z" fill="url(#glow7)" opacity="0.92"/>
  <!-- homme agenouillé, mains jointes -->
  <g fill="#5a3c0c">
    <circle cx="410" cy="110" r="15"/>
    <path d="M410,124 Q386,150 392,196 L428,196 Q434,150 410,124 Z"/>
    <path d="M410,132 L398,160 L410,150 L422,160 Z"/>
    <rect x="372" y="196" width="76" height="14" rx="4"/>
  </g>
  <rect x="347" y="214" width="126" height="33" fill="#000" opacity="0.45"/>
  <text x="410" y="237" text-anchor="middle" fill="#ffe9a8" font-size="19" font-style="italic">prière</text>

  <!-- ============ RANGÉE DES 6 VITRAUX (ordre d'affichage = charabia) ============ -->
  <!-- gabarit : chaque fenêtre 110x200, sommet arrondi, bandeau du mot en bas -->

  <!-- 1) mot "A" — des silhouettes minuscules autour de la haute pierre -->
  <path d="M30,500 L30,342 Q30,300 85,300 Q140,300 140,342 L140,500 Z" fill="#2f7d8a" stroke="#c9a227" stroke-width="5"/>
  <rect x="80" y="360" width="10" height="86" fill="#e8d9a0"/>
  <g fill="#0d3a40">
    <circle cx="62" cy="452" r="6"/><circle cx="108" cy="452" r="6"/>
    <circle cx="76" cy="462" r="5"/><circle cx="98" cy="462" r="5"/>
  </g>
  <rect x="30" y="466" width="110" height="34" fill="#000" opacity="0.5"/>
  <text x="85" y="489" text-anchor="middle" fill="#ffe9a8" font-size="20" font-weight="bold">A</text>

  <!-- 2) mot "ell" — une plaine, un ciel, un soleil -->
  <path d="M158,500 L158,342 Q158,300 213,300 Q268,300 268,342 L268,500 Z" fill="#356f9e" stroke="#c9a227" stroke-width="5"/>
  <circle cx="213" cy="345" r="18" fill="#f2c84b"/>
  <line x1="170" y1="420" x2="256" y2="420" stroke="#7ad08a" stroke-width="6"/>
  <rect x="166" y="420" width="94" height="46" fill="#2e7d4f" opacity="0.55"/>
  <rect x="158" y="466" width="110" height="34" fill="#000" opacity="0.5"/>
  <text x="213" y="489" text-anchor="middle" fill="#ffe9a8" font-size="20" font-weight="bold">ell</text>

  <!-- 3) mot "cc" — une pierre dressée ; à son pied, une forme casquée -->
  <path d="M286,500 L286,342 Q286,300 341,300 Q396,300 396,342 L396,500 Z" fill="#2a5a73" stroke="#c9a227" stroke-width="5"/>
  <rect x="318" y="324" width="14" height="120" fill="#8fd3e6"/>
  <g fill="#0d2b36">
    <path d="M350,388 a14,14 0 0,1 28,0 l-2,6 -24,0 Z"/>
    <rect x="350" y="398" width="28" height="42" rx="4"/>
  </g>
  <rect x="286" y="466" width="110" height="34" fill="#000" opacity="0.5"/>
  <text x="341" y="489" text-anchor="middle" fill="#ffe9a8" font-size="20" font-weight="bold">cc</text>

  <!-- 4) mot "Crie" — une silhouette seule dans un néant sans bord -->
  <path d="M414,500 L414,342 Q414,300 469,300 Q524,300 524,342 L524,500 Z" fill="#2c2a47" stroke="#c9a227" stroke-width="5"/>
  <g fill="#aeb3d6">
    <circle cx="469" cy="372" r="14"/>
    <path d="M469,388 Q449,418 455,452 L483,452 Q489,418 469,388 Z"/>
  </g>
  <rect x="414" y="466" width="110" height="34" fill="#000" opacity="0.5"/>
  <text x="469" y="489" text-anchor="middle" fill="#ffe9a8" font-size="20" font-weight="bold">Crie</text>

  <!-- 5) mot "Sh" — deux mains élèvent les murs d'une première salle -->
  <path d="M542,500 L542,342 Q542,300 597,300 Q652,300 652,342 L652,500 Z" fill="#356f6a" stroke="#c9a227" stroke-width="5"/>
  <rect x="572" y="350" width="50" height="60" fill="none" stroke="#e8d9a0" stroke-width="5"/>
  <g fill="#0d3633">
    <path d="M566,452 l8,-26 6,2 -6,24 Z"/>
    <path d="M628,452 l-8,-26 -6,2 6,24 Z"/>
  </g>
  <rect x="542" y="466" width="110" height="34" fill="#000" opacity="0.5"/>
  <text x="597" y="489" text-anchor="middle" fill="#ffe9a8" font-size="20" font-weight="bold">Sh</text>

  <!-- 6) mot "ess" — la silhouette tend les bras vers une femme à son visage -->
  <path d="M670,500 L670,342 Q670,300 725,300 Q780,300 780,342 L780,500 Z" fill="#5a3a6e" stroke="#c9a227" stroke-width="5"/>
  <g fill="#e7c9f0">
    <circle cx="702" cy="372" r="12"/>
    <path d="M702,386 Q686,414 690,450 L714,450 Q718,414 702,386 Z"/>
    <circle cx="748" cy="372" r="12"/>
    <path d="M748,386 Q734,414 738,450 L762,450 Q766,414 748,386 Z"/>
  </g>
  <rect x="712" y="396" width="26" height="6" fill="#f4e3a0"/>
  <rect x="670" y="466" width="110" height="34" fill="#000" opacity="0.5"/>
  <text x="725" y="489" text-anchor="middle" fill="#ffe9a8" font-size="20" font-weight="bold">ess</text>

  <text x="410" y="538" text-anchor="middle" fill="#8a8699" font-size="13" font-style="italic">Tels qu'affichés (gauche → droite) : les mots ne veulent rien dire.</text>
</svg>
